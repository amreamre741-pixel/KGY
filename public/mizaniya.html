    .ms-month-picker button {

    .ms-bottom-nav {

      cursor: pointer; font-size: 14px; line-height: 1; padding: 2px; color: #cbd5e1;
    }
    .ms-star-btn.active { color: #f59e0b; }

    .ms-search-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .ms-fixed-grid { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
    .ms-fixed-chip {

    .ms-cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);

    .ms-cal-day {
      background: var(--ms-surface-2);
      border: 1px solid var(--ms-border);
      border-radius: 10px;
      padding: 6px 2px;
      text-align: center;

      flex-direction: column;
      align-items: center;
      justify-content: center;

    }
    .ms-cal-day.worked {

      border-color: var(--ms-income);

    .ms-cal-day.today {

    .ms-cal-num { font-size: 11px; font-weight: 700; color: var(--ms-muted); }
    .ms-cal-day.worked .ms-cal-num { color: var(--ms-income); }
    .ms-cal-amt { font-size: 10px; font-weight: 700; color: var(--ms-income); }
    .ms-compare-row {

      background: var(--ms-surface-2); border: 1px solid var(--ms-border);
      border-radius: 12px; padding: 10px 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 12px; font-weight: 600;
    }
  </style>
</head>

    const EXP_CATS = CATEGORIES.filter(c => c.kind === "expense");
    const INC_CATS = CATEGORIES.filter(c => c.kind === "income");

    function todayISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }
    function shiftMonth(mk, delta) {
      const [y, m] = mk.split("-").map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }
    function formatMonthAr(mk) {
      const [y, m] = mk.split("-").map(Number);
      return new Intl.DateTimeFormat("ar-DZ", { month: "long", year: "numeric" }).format(new Date(y, m - 1, 1));
    }

    function daysUntil(dateStr) {
      if (!dateStr) return null;
      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const [y, m, d] = dateStr.split("-").map(Number);
      const target = new Date(y, m - 1, d);
      return Math.ceil((target - todayStart) / (1000 * 60 * 60 * 24));
    }

    function addDaysISO(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

        transactions: [

          { id: "d_2", person: "محل الحي", type: "borrowed", amount: 3000, note: "كريدي قفة", paid: false, dueDate: addDaysISO(10) },
        ],
        fixedBills: [
          { id: "fb_1", title: "تعبئة الإنترنت", emoji: "🌐", amount: 2000, categoryId: "bills", lastPaidMonth: "" },
          { id: "fb_2", title: "الكراء الشهري", emoji: "🏠", amount: 15000, categoryId: "rent", lastPaidMonth: "" },
        ],
        quickSpends: [
          { id: "qs_1", label: "خبز", emoji: "🥖", amount: 50, categoryId: "groceries" },
          { id: "qs_2", label: "حليب", emoji: "🥛", amount: 100, categoryId: "groceries" },
          { id: "qs_3", label: "قهوة", emoji: "☕", amount: 100, categoryId: "groceries" },
          { id: "qs_4", label: "بيض", emoji: "🥚", amount: 300, categoryId: "groceries" },
        ],
        currencyMode: "dzd",
        darkMode: false,
        autoSavePct: 20,
      };
    }

    function getRemainingDaysInMonth(mk) {
      const [y, m] = mk.split("-").map(Number);
      const totalDays = new Date(y, m, 0).getDate();
      const now = new Date();
      const isCurrentMonth = now.getFullYear() === y && (now.getMonth() + 1) === m;
      if (isCurrentMonth) return Math.max(1, totalDays - now.getDate() + 1);
      return totalDays;
    }

    let state = defaultState();
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) state = { ...defaultState(), ...JSON.parse(saved) };
    } catch {}

    let activeTab = "dashboard";
    let monthKey = todayISO().slice(0, 7);
    let searchQuery = "";
    let selectedSubItems = [];

    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
      render();
    }

    function fmt(amount) {
      if (state.hideAmounts) return "••••";
      if (state.currencyMode === "centime") return `${Math.round(amount * 100).toLocaleString("fr-DZ")} سنتيم`;
      return `${Math.round(amount).toLocaleString("fr-DZ")} دج`;
    }

    function getCat(id) { return CATEGORIES.find(c => c.id === id); }
    function getWallet(id) { return state.wallets.find(w => w.id === id); }
    function getItemsForCategory(catId) {
      return [...(DEFAULT_CATEGORY_ITEMS[catId] || []), ...((state.customItems && state.customItems[catId]) || [])];
    }

    const backdrop = document.getElementById("modalBackdrop");
    const modalContent = document.getElementById("modalContent");
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeModal(); });
    function openModal(html) { modalContent.innerHTML = html; backdrop.classList.add("open"); }
    function closeModal() { backdrop.classList.remove("open"); selectedSubItems = []; }

    window.setTab = (t) => { activeTab = t; render(); };
    window.changeMonth = (d) => { monthKey = shiftMonth(monthKey, d); render(); };
    window.toggleCurrency = () => { state.currencyMode = state.currencyMode === "dzd" ? "centime" : "dzd"; save(); };
    window.toggleDarkMode = () => { state.darkMode = !state.darkMode; save(); };
    window.togglePrivacy = () => { state.hideAmounts = !state.hideAmounts; save(); };
    window.exportBackup = () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `mizaniya-backup-${todayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    };
    window.importBackup = (input) => {
      const file = input.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result));
          if (parsed && Array.isArray(parsed.wallets) && Array.isArray(parsed.transactions)) {
            state = { ...defaultState(), ...parsed };
            save();
            alert("✅ تم استرجاع نسختك الاحتياطية بنجاح!");
          } else {
            alert("⚠️ هذا الملف غير صالح.");
          }
        } catch {
          alert("⚠️ تعذر قراءة الملف.");
        }
      };
      reader.readAsText(file);
      input.value = "";
    };
    window.setAutoSavePct = (v) => { state.autoSavePct = Math.max(0, Math.min(80, Number(v) || 0)); save(); };
    window.toggleNoWorkToday = () => {
      const t = todayISO();
      state.noWorkDate = state.noWorkDate === t ? "" : t;
      save();
    };
    window.updateSearch = (val) => { searchQuery = val; render(); const el = document.getElementById("txSearchInput"); if (el) { el.focus(); el.setSelectionRange(val.length, val.length); } };

    // --- Sub-items + Custom items + Favorites ---
    function renderSubItemsSection(catId) {
      const wrap = document.getElementById("subItemsContainer");
      if (!wrap) return;
      const items = getItemsForCategory(catId);
      const favs = state.favoriteItems || [];
      const sorted = [...items].sort((a, b) => (favs.includes(b.id) ? 1 : 0) - (favs.includes(a.id) ? 1 : 0));

      wrap.innerHTML = `
        <div class="ms-subitems-wrap">
          <div class="ms-subitems-head">
            <span>اختر مادة أو عدة مواد معاً 🛒 (⭐ للتثبيت)</span>
            <button type="button" class="ms-btn-outline ms-btn-sm" onclick="addCustomSubItem('${catId}')">+ مادة جديدة</button>
          </div>
          ${sorted.length === 0 ? `<div style="font-size:12px;color:var(--ms-muted);text-align:center;padding:8px">لا توجد مواد بعد — اضغط "+ مادة جديدة" لإضافة موادك</div>` : `
          <div class="ms-subitems-grid">
            ${sorted.map(item => {
              const isFav = favs.includes(item.id);
              const isSel = selectedSubItems.some(s => s.id === item.id);
              return `
                <div class="ms-subitem-card ${isFav ? "fav" : ""} ${isSel ? "selected" : ""}" onclick="pickSubItem('${catId}', '${item.id}')">
                  <button type="button" class="ms-star-btn ${isFav ? "active" : ""}" onclick="event.stopPropagation(); toggleFavItem('${catId}', '${item.id}')">${isFav ? "★" : "☆"}</button>
                  <div class="ms-subitem-emoji">${item.emoji}</div>
                  <div class="ms-subitem-name">${item.label}</div>
                </div>
              `;
            }).join("")}
          </div>`}
        </div>
      `;
    }

    window.addCustomSubItem = (catId) => {
      const label = prompt("اكتب اسم المادة الجديدة (مثلاً: ياغورت، دلاح، قهوة...):");
      if (!label || !label.trim()) return;
      const emoji = prompt("اختر رمزاً أو إيموجي للمادة (اختياري):", "🛍️") || "🛍️";
      const item = { id: "ci_" + Date.now(), label: label.trim(), emoji: emoji.trim() || "🛍️" };
      if (!state.customItems) state.customItems = {};
      if (!state.customItems[catId]) state.customItems[catId] = [];
      state.customItems[catId].push(item);
      selectedSubItems.push(item);
      const noteInput = document.getElementById("txNote");
      if (noteInput) noteInput.value = selectedSubItems.map(s => s.label).join(" + ");
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
      renderSubItemsSection(catId);
    };

    function updateLastPriceHint() {
      const box = document.getElementById("lastPriceHint");
      const noteEl = document.getElementById("txNote");
      const amtEl = document.getElementById("txAmount");
      if (!box || !noteEl) return;
      const key = noteEl.value.trim().toLowerCase();
      if (!key) {
        box.style.display = "none";
        return;
      }
      const prev = state.transactions.find(t => t.type === "expense" && (t.note || "").trim().toLowerCase() === key);
      if (!prev) {
        box.style.display = "none";
        return;
      }
      const curAmt = Number(amtEl?.value) || 0;
      let diffHtml = "";
      if (curAmt > 0 && curAmt !== prev.amount) {
        const diff = curAmt - prev.amount;
        diffHtml = diff > 0
          ? ` <span class="ms-badge ms-badge-danger">📈 +${fmt(diff)}</span>`
          : ` <span class="ms-badge ms-badge-ok">📉 أقل بـ ${fmt(Math.abs(diff))}</span>`;
      }
      box.style.display = "flex";
      box.innerHTML = `
        <span>🏷️ آخر سعر لـ <strong>${prev.note}</strong>: <strong>${fmt(prev.amount)}</strong> (${prev.date})${diffHtml}</span>
        <button type="button" class="ms-btn-outline ms-btn-sm" onclick="const a=document.getElementById('txAmount');if(a){a.value='${prev.amount}';a.dispatchEvent(new Event('input'));}">نفس السعر</button>
      `;
    }

    window.pickSubItem = (catId, itemId) => {
      const item = getItemsForCategory(catId).find(i => i.id === itemId);
      if (!item) return;
      const exists = selectedSubItems.some(s => s.id === itemId);
      if (exists) {
        selectedSubItems = selectedSubItems.filter(s => s.id !== itemId);
      } else {
        selectedSubItems = [...selectedSubItems, item];
      }
      const noteInput = document.getElementById("txNote");
      if (noteInput) noteInput.value = selectedSubItems.map(s => s.label).join(" + ");
      renderSubItemsSection(catId);
      updateLastPriceHint();
    };

    window.toggleFavItem = (catId, itemId) => {
      const favs = state.favoriteItems || [];
      state.favoriteItems = favs.includes(itemId) ? favs.filter(id => id !== itemId) : [...favs, itemId];
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
      renderSubItemsSection(catId);
    };

    // --- Transactions ---
    window.openTxModal = (type) => {
      selectedSubItems = [];
      const title = type === "expense" ? "تسجيل مصروف جديد" : type === "income" ? "تسجيل مدخول جديد" : "تحويل بين المحافظ";
      const cats = type === "expense" ? EXP_CATS : INC_CATS;
      const wOpts = state.wallets.map(w => `<option value="${w.id}">${w.emoji} ${w.name}</option>`).join("");
      const wOpts2 = state.wallets.map((w, i) => `<option value="${w.id}" ${i === 1 ? "selected" : ""}>${w.emoji} ${w.name}</option>`).join("");
      const pct = state.autoSavePct || 0;
      const boxWallet = state.wallets.find(w => w.id === "w_box") || state.wallets[state.wallets.length - 1];
      openModal(`
        <h3>${title}</h3>
        <form id="txForm">
          <div class="ms-field">
            <label>المبلغ (دج)</label>
            <input type="number" id="txAmount" min="1" required autofocus class="ms-input" placeholder="${type === "income" ? "مثال: 2000 أو 3000" : "مثال: 600"}" />
          </div>
          ${type === "expense" ? `<div id="lastPriceHint" class="ms-subitems-wrap" style="display:none;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px"></div>` : ""}
          ${type === "income" && pct > 0 && boxWallet ? `
          <div class="ms-subitems-wrap" style="margin-bottom:12px">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600">
              <input type="checkbox" id="txAutoSave" checked />
              <span>🏦 ادخار تلقائي (${pct}%) إلى ${boxWallet.name}</span>
            </label>
            <div id="autoSavePreview" style="font-size:12px;color:var(--ms-muted);margin-top:6px">
              أدخل مبلغ اليوم لرؤية التقسيم التلقائي بين المصاريف والادخار.
            </div>
          </div>` : ""}
          ${type !== "transfer" ? `
          <div class="ms-field">
            <label>الفئة</label>
            <select id="txCat" class="ms-select">${cats.map(c => `<option value="${c.id}">${c.emoji} ${c.label}</option>`).join("")}</select>
          </div>
          <div id="subItemsContainer"></div>` : ""}
          <div class="ms-field">
            <label>${type === "transfer" ? "من المحفظة" : "المحفظة"}</label>
            <select id="txWallet" class="ms-select">${wOpts}</select>
          </div>
          ${type === "transfer" ? `<div class="ms-field"><label>إلى المحفظة</label><select id="txToWallet" class="ms-select">${wOpts2}</select></div>` : ""}
          <div class="ms-field"><label>التاريخ</label><input type="date" id="txDate" class="ms-input" value="${todayISO()}" /></div>
          <div class="ms-field"><label>ملاحظة (اختياري)</label><input type="text" id="txNote" class="ms-input" placeholder="${type === "income" ? "مثال: مدخول اليوم" : "مثال: بيض / مقاضي"}" /></div>
          <div class="ms-modal-actions">
            <button type="button" class="ms-btn-outline" onclick="closeModal()">إلغاء</button>
            <button type="submit" class="ms-btn">حفظ العملية</button>
          </div>
        </form>
      `);
      if (type === "expense") {
        const catSelect = document.getElementById("txCat");
        renderSubItemsSection(catSelect.value);
        catSelect.addEventListener("change", () => { selectedSubItems = []; renderSubItemsSection(catSelect.value); });
        document.getElementById("txAmount")?.addEventListener("input", updateLastPriceHint);
        document.getElementById("txNote")?.addEventListener("input", updateLastPriceHint);
      }
      if (type === "income" && pct > 0 && boxWallet) {
        const amtEl = document.getElementById("txAmount");
        const prevEl = document.getElementById("autoSavePreview");
        amtEl.addEventListener("input", () => {
          const val = Number(amtEl.value) || 0;
          if (val <= 0) {
            prevEl.textContent = "أدخل مبلغ اليوم لرؤية التقسيم التلقائي بين المصاريف والادخار.";
          } else {
            const toSave = Math.round(val * pct / 100);
            const toSpend = val - toSave;
            prevEl.innerHTML = `سيُحفظ <strong>${fmt(toSave)}</strong> في الشحيحة، ويبقى <strong>${fmt(toSpend)}</strong> للمصاريف.`;
          }
        });
      }
      document.getElementById("txForm").onsubmit = (e) => {
        e.preventDefault();
        const amount = Number(document.getElementById("txAmount").value);
        if (!amount || amount <= 0) return;
        const walletId = document.getElementById("txWallet").value;
        const toWalletId = type === "transfer" ? document.getElementById("txToWallet").value : undefined;
        const categoryId = type === "transfer" ? "transfer" : document.getElementById("txCat").value;
        const note = document.getElementById("txNote").value.trim();
        const date = document.getElementById("txDate").value || todayISO();
        const doAutoSave = type === "income" && document.getElementById("txAutoSave")?.checked && pct > 0 && boxWallet && boxWallet.id !== walletId;
        const savedPart = doAutoSave ? Math.round(amount * pct / 100) : 0;
        const spendPart = amount - savedPart;

        state.wallets = state.wallets.map(w => {
          if (type === "expense" && w.id === walletId) return { ...w, balance: w.balance - amount };
          if (type === "income") {
            if (w.id === walletId) return { ...w, balance: w.balance + spendPart };
            if (doAutoSave && w.id === boxWallet.id) return { ...w, balance: w.balance + savedPart };
          }
          if (type === "transfer") {
            if (w.id === walletId) return { ...w, balance: w.balance - amount };
            if (w.id === toWalletId) return { ...w, balance: w.balance + amount };
          }
          return w;
        });
        const pickedEmoji = selectedSubItems.length === 1 ? selectedSubItems[0].emoji : selectedSubItems.length > 1 ? "🛒" : undefined;
        state.transactions.unshift({
          id: "tx_" + Date.now(), type, amount, categoryId,
          itemEmoji: pickedEmoji,
          walletId, toWalletId,
          note: note || (doAutoSave ? `أجرة اليوم (ادخار ${fmt(savedPart)})` : ""),
          date,
        });
        closeModal();
        save();
      };
    };

    window.deleteTx = (id) => {
      const tx = state.transactions.find(t => t.id === id);
      if (!tx) return;
      state.wallets = state.wallets.map(w => {
        if (tx.type === "expense" && w.id === tx.walletId) return { ...w, balance: w.balance + tx.amount };
        if (tx.type === "income" && w.id === tx.walletId) return { ...w, balance: w.balance - tx.amount };
        if (tx.type === "transfer") {
          if (w.id === tx.walletId) return { ...w, balance: w.balance + tx.amount };
          if (w.id === tx.toWalletId) return { ...w, balance: w.balance - tx.amount };
        }
        return w;
      });
      state.transactions = state.transactions.filter(t => t.id !== id);
      save();
    };

    // --- Shopping List (ورقة القضيان) ---
    window.addShoppingItem = (e) => {
      e.preventDefault();
      const nameEl = document.getElementById("shopName");
      const emojiEl = document.getElementById("shopEmoji");
      const name = nameEl.value.trim();
      if (!name) return;
      state.shoppingList.unshift({ id: "sh_" + Date.now(), name, emoji: emojiEl.value || "🛒", done: false });
      save();
    };

    window.buyShoppingItem = (id) => {
      const item = state.shoppingList.find(s => s.id === id);
      if (!item) return;
      const wOpts = state.wallets.map(w => `<option value="${w.id}">${w.emoji} ${w.name}</option>`).join("");
      openModal(`
        <h3>تسجيل شراء: ${item.emoji} ${item.name}</h3>
        <form id="buyForm">
          <div class="ms-field"><label>كم دفعت؟ (دج)</label><input id="buyAmt" type="number" min="1" required autofocus class="ms-input" placeholder="مثال: 400" /></div>
          <div class="ms-field"><label>المحفظة</label><select id="buyWal" class="ms-select">${wOpts}</select></div>
          <div class="ms-modal-actions">
            <button type="button" class="ms-btn-outline" onclick="closeModal()">إلغاء</button>
            <button type="submit" class="ms-btn">✓ تم الشراء وتسجيل المصروف</button>
          </div>
        </form>
      `);
      document.getElementById("buyForm").onsubmit = (e) => {
        e.preventDefault();
        const amt = Number(document.getElementById("buyAmt").value);
        const wid = document.getElementById("buyWal").value;
        state.shoppingList = state.shoppingList.map(s => s.id === id ? { ...s, done: true } : s);
        state.wallets = state.wallets.map(w => w.id === wid ? { ...w, balance: w.balance - amt } : w);
        state.transactions.unshift({
          id: "tx_" + Date.now(), type: "expense", amount: amt, categoryId: "groceries",
          itemEmoji: item.emoji, walletId: wid, note: item.name, date: todayISO(),
        });
        closeModal();
        save();
      };
    };

    window.deleteShoppingItem = (id) => { state.shoppingList = state.shoppingList.filter(s => s.id !== id); save(); };
    window.clearDoneShopping = () => { state.shoppingList = state.shoppingList.filter(s => !s.done); save(); };

    // --- Debts (دفتر الديون والسلف) ---
    window.openDebtModal = () => {
      openModal(`
        <h3>تسجيل دين / سلف</h3>
        <form id="dForm">
          <div class="ms-field">
            <label>النوع</label>
            <select id="dType" class="ms-select">
              <option value="lent">لي عند الناس (أسلفت شخصاً)</option>
              <option value="borrowed">عليّ للناس (تدينت من شخص)</option>
            </select>
          </div>
          <div class="ms-field"><label>اسم الشخص / المحل</label><input id="dPerson" required class="ms-input" placeholder="مثال: كريم / محل الحي" /></div>
          <div class="ms-field"><label>المبلغ (دج)</label><input id="dAmt" type="number" min="1" required class="ms-input" placeholder="2000" /></div>
          <div class="ms-field"><label>تاريخ الاستحقاق / السداد (اختياري)</label><input id="dDue" type="date" class="ms-input" /></div>
          <div class="ms-field"><label>ملاحظة (اختياري)</label><input id="dNote" class="ms-input" placeholder="مثال: سلف حتى آخر الشهر" /></div>
          <div class="ms-modal-actions">
            <button type="button" class="ms-btn-outline" onclick="closeModal()">إلغاء</button>
            <button type="submit" class="ms-btn">حفظ</button>
          </div>
        </form>
      `);
      document.getElementById("dForm").onsubmit = (e) => {
        e.preventDefault();
        state.debts.unshift({
          id: "d_" + Date.now(),
          type: document.getElementById("dType").value,
          person: document.getElementById("dPerson").value.trim(),
          amount: Number(document.getElementById("dAmt").value),
          dueDate: document.getElementById("dDue").value || "",
          note: document.getElementById("dNote").value.trim(),
          paid: false,
        });
        closeModal();
        save();
      };
    };

    window.settleDebt = (id) => {
      const d = state.debts.find(x => x.id === id);
      if (!d || d.paid) return;
      const wOpts = state.wallets.map(w => `<option value="${w.id}">${w.emoji} ${w.name}</option>`).join("");
      openModal(`
        <h3>تسديد: ${d.person} (${fmt(d.amount)})</h3>
        <form id="sdForm">
          <div class="ms-field">
            <label>${d.type === "lent" ? "إضافة المبلغ المسترجع إلى محفظة" : "خصم المبلغ المسدد من محفظة"}</label>
            <select id="sdWal" class="ms-select">${wOpts}</select>
          </div>

      const avgPerWorkDay = workDaysCount > 0 ? Math.round(mInc / workDaysCount) : 0;

      const q = searchQuery.trim().toLowerCase();
      const filteredTxs = q ? mTxs.filter(t => {
        const cat = getCat(t.categoryId)?.label || "";
        return (t.note || "").toLowerCase().includes(q) || cat.toLowerCase().includes(q);

      const filteredSum = filteredTxs.filter(t => t.type === "expense").reduce((s, t) => s + t.amount, 0);

      const sortedCats = EXP_CATS.map(c => ({ ...c, spent: expByCat[c.id] || 0 })).filter(c => c.spent > 0).sort((a, b) => b.spent - a.spent);

      const upcomingPlans = [];
      state.debts.forEach(d => {
        if (!d.paid && d.type === "borrowed" && d.dueDate) {
          const days = daysUntil(d.dueDate);
          if (days !== null) {
            const perDay = days > 0 ? Math.ceil(d.amount / days) : d.amount;
            upcomingPlans.push({ emoji: "📌", title: `دين: ${d.person}`, days, perDay, remaining: d.amount });
          }
        }
      });
      state.goals.forEach(g => {
        const rem = Math.max(0, g.target - g.saved);
        if (rem > 0 && g.dueDate) {
          const days = daysUntil(g.dueDate);
          if (days !== null) {
            const perDay = days > 0 ? Math.ceil(rem / days) : rem;
            upcomingPlans.push({ emoji: g.emoji, title: g.title, days, perDay, remaining: rem });
          }
        }
      });
      upcomingPlans.sort((a, b) => a.days - b.days);
      const totalDailyNeeded = upcomingPlans.reduce((s, p) => s + p.perDay, 0);

      const prevMonthKey = shiftMonth(monthKey, -1);
      const prevTxs = state.transactions.filter(t => t.date.startsWith(prevMonthKey));
      const prevInc = prevTxs.filter(t => t.type === "income").reduce((s, t) => s + t.amount, 0);
      const prevExp = prevTxs.filter(t => t.type === "expense").reduce((s, t) => s + t.amount, 0);
      const incDiff = mInc - prevInc;
      const expDiff = mExp - prevExp;

      const [cy, cm] = monthKey.split("-").map(Number);
      const daysInMonth = new Date(cy, cm, 0).getDate();
      const incomeByDay = {};
      mTxs.forEach(t => {

                    <div class="ms-tx-left">
                      <div class="ms-tx-emoji">${item.emoji}</div>
                      <div class="ms-tx-title ${item.done ? "ms-done" : ""}">${item.name}</div>
                    </div>
                    <div class="ms-tx-right">
                      ${item.done
                        ? `<span class="ms-badge ms-badge-ok">✓ تم الشراء</span>`
                        : `<button class="ms-btn ms-btn-sm" onclick="buyShoppingItem('${item.id}')">تم الشراء ✓</button>`}
                      <button class="ms-icon-btn" onclick="deleteShoppingItem('${item.id}')">✕</button>
                    </div>
                  </div>
                `).join("")}
              </div>`}
          </section>
        `;
      } else if (activeTab === "debts") {
        const totalLent = state.debts.filter(d => d.type === "lent" && !d.paid).reduce((s, d) => s + d.amount, 0);
        const totalBorrowed = state.debts.filter(d => d.type === "borrowed" && !d.paid).reduce((s, d) => s + d.amount, 0);
        mainHtml = `
          <div class="ms-grid-2">
            <div class="ms-card">
              <div class="ms-kpi-title"><span>لي عند الناس (سلف)</span><span>💚</span></div>
              <div class="ms-kpi-num ms-num-income">${fmt(totalLent)}</div>
            </div>
            <div class="ms-card">
              <div class="ms-kpi-title"><span>عليّ للناس (ديون)</span><span>❤️</span></div>
              <div class="ms-kpi-num ms-num-expense">${fmt(totalBorrowed)}</div>
            </div>
          </div>
          <section class="ms-card">
            <div class="ms-section-head">
              <h2>🤝 دفتر الديون والسلف</h2>
              <button class="ms-btn" onclick="openDebtModal()">+ تسجيل دين</button>
            </div>
            ${state.debts.length === 0 ? `<div class="ms-empty">لا توجد ديون مسجلة حالياً.</div>` : `
              <div class="ms-list">
                ${state.debts.map(d => `
                  <div class="ms-tx-item">
                    <div class="ms-tx-left">
                      <div class="ms-tx-emoji">${d.type === "lent" ? "🤝" : "📌"}</div>
                      <div>
                        <div class="ms-tx-title ${d.paid ? "ms-done" : ""}">${d.person} — <span class="${d.type === "lent" ? "ms-num-income" : "ms-num-expense"}">${fmt(d.amount)}</span></div>
                        <div class="ms-tx-meta">${d.type === "lent" ? "لي عنده" : "عليّ له"}${d.note ? " · " + d.note : ""}</div>
                      </div>
                    </div>
                    <div class="ms-tx-right">
                      ${d.paid
                        ? `<span class="ms-badge ms-badge-ok">✓ مسدد</span>`
                        : `<button class="ms-btn ms-btn-sm" onclick="settleDebt('${d.id}')">تم السداد ✓</button>`}
                      <button class="ms-icon-btn" onclick="deleteDebt('${d.id}')">✕</button>
                    </div>
                  </div>
                `).join("")}
              </div>`}
          </section>
        `;
      } else if (activeTab === "goals") {
        mainHtml = `
          <section>
            <div class="ms-section-head">
              <h2>🎯 أهداف الادخار</h2>
              <button class="ms-btn" onclick="openGoalModal()">+ هدف جديد</button>
            </div>
            <div class="ms-card" style="margin-bottom:14px;padding:12px 14px">
              <div style="font-size:12px;font-weight:700;color:var(--ms-muted);margin-bottom:8px">🌙 صندوق المواسم (إضافة سريعة لهدف موسمي):</div>
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                <button class="ms-btn-outline ms-btn-sm" onclick="openGoalModal('صندوق رمضان', '🌙')">🌙 رمضان</button>
                <button class="ms-btn-outline ms-btn-sm" onclick="openGoalModal('صندوق العيد', '🐑')">🐑 العيد</button>
                <button class="ms-btn-outline ms-btn-sm" onclick="openGoalModal('الدخول المدرسي', '🎒')">🎒 الدخول المدرسي</button>
                <button class="ms-btn-outline ms-btn-sm" onclick="openGoalModal('صندوق الصدقة', '🤲')">🤲 الصدقة</button>
              </div>
            </div>
            ${state.goals.length === 0 ? `<div class="ms-card ms-empty">لا توجد أهداف ادخار حالياً.</div>` : `
              <div class="ms-grid-2">
                ${state.goals.map(g => {
                  const pct = Math.min(100, Math.round((g.saved / g.target) * 100));
                  const rem = Math.max(0, g.target - g.saved);
                  return `<div class="ms-card">
                    <div class="ms-section-head" style="margin-bottom:10px">
                      <div style="display:flex;align-items:center;gap:8px"><span style="font-size:22px">${g.emoji}</span><strong>${g.title}</strong></div>
                      <button class="ms-icon-btn" onclick="deleteGoal('${g.id}')">✕</button>
                    </div>
                    <div class="ms-bar-row" style="margin-bottom:12px">
                      <div class="ms-bar-head"><span>المجموع: ${fmt(g.saved)}</span><span>${pct}%</span></div>
                      <div class="ms-bar-track"><div class="ms-bar-fill" style="width:${pct}%;background:#0f766e"></div></div>
                      <div class="ms-tx-meta">الهدف: ${fmt(g.target)} · المتبقي: ${fmt(rem)}</div>
                    </div>
                    <button class="ms-btn" style="width:100%" onclick="openFundGoal('${g.id}')">+ إضافة مبلغ لهذا الهدف</button>
                  </div>`;
                }).join("")}
              </div>`}
          </section>
        `;
      } else if (activeTab === "wallets") {
        mainHtml = `
          <section>
            <div class="ms-section-head">
              <h2>👛 محافظك وحساباتك</h2>
              <button class="ms-btn" onclick="openWalletModal()">+ إضافة محفظة</button>
            </div>
            <div class="ms-wallet-grid">
              ${state.wallets.map(w => `
                <div class="ms-wallet-card">
                  <div style="display:flex;justify-content:space-between;align-items:center">
                    <span style="font-size:26px">${w.emoji}</span>
                    <div style="display:flex;gap:6px;align-items:center">
                      <button class="ms-btn-outline ms-btn-sm" onclick="openEditWalletModal('${w.id}')">✏️ تعديل</button>
                      <button class="ms-icon-btn" onclick="deleteWallet('${w.id}')" title="حذف المحفظة">✕</button>
                    </div>
                  </div>
                  <div style="font-weight:700;font-size:15px">${w.name}</div>
                  <div class="ms-kpi-num ms-num-primary">${fmt(w.balance)}</div>
                </div>
              `).join("")}
            </div>
          </section>

          <section class="ms-card">
            <div class="ms-section-head"><h2>📋 سقف الميزانية الشهرية (${formatMonthAr(monthKey)})</h2></div>
            <div class="ms-list">
              ${EXP_CATS.map(c => {
                const limit = state.budgets[c.id] || 0;
                const spent = expByCat[c.id] || 0;
                const pct = limit > 0 ? Math.min(100, Math.round((spent / limit) * 100)) : 0;
                const over = limit > 0 && spent > limit;
                const warn = limit > 0 && pct >= 75 && !over;
                return `<div class="ms-tx-item" style="flex-direction:column;align-items:stretch">
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
                    <div style="font-weight:700;font-size:14px">${c.emoji} ${c.label}</div>
                    <div style="display:flex;align-items:center;gap:8px">
                      <span style="font-size:12px;color:var(--ms-muted)">السقف (دج):</span>
                      <input type="number" min="0" class="ms-input" style="width:110px;padding:6px 8px" value="${limit || ""}" placeholder="0" onchange="updateBudget('${c.id}', this.value)" />
                    </div>
                  </div>
                  ${limit > 0 ? `
                    <div class="ms-bar-row" style="margin-top:6px">
                      <div class="ms-bar-head">
                        <span>المصروف: ${fmt(spent)}</span>
                        <span class="ms-badge ${over ? "ms-badge-danger" : warn ? "ms-badge-warn" : "ms-badge-ok"}">${over ? "تجاوزت السقف!" : pct + "%"}</span>
                      </div>
                      <div class="ms-bar-track"><div class="ms-bar-fill" style="width:${pct}%;background:${over ? "#be123c" : warn ? "#d97706" : "#0f766e"}"></div></div>
                    </div>` : ""}
                </div>`;
              }).join("")}
            </div>
          </section>

          <section class="ms-card">
            <div class="ms-section-head" style="margin-bottom:6px">
              <h2>💾 النسخ الاحتياطي وحماية البيانات</h2>
            </div>
            <p style="margin:0 0 12px;font-size:12px;color:var(--ms-muted)">
              احفظ نسخة من كل حساباتك على هاتفك حتى لا تضيع أبداً إذا غيرت الهاتف أو فرمتّه.
            </p>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button class="ms-btn" onclick="exportBackup()">⬇️ حفظ نسخة احتياطية</button>
              <button class="ms-btn-outline" onclick="document.getElementById('backupFileInput').click()">⬆️ استرجاع نسخة</button>
              <input id="backupFileInput" type="file" accept="application/json" style="display:none" onchange="importBackup(this)" />
            </div>
          </section>
        `;
      }

      document.getElementById("app").innerHTML = `
        <header class="ms-header">
          <div class="ms-container">
            <div class="ms-topbar">
              <div class="ms-brand">
                <div class="ms-brand-icon">⚖️</div>
                <div><h1>ميزانية</h1><p>تسيير المال والادخار المنزلي</p></div>
              </div>
              <div class="ms-top-controls">
                <div class="ms-month-picker">
                  <button onclick="changeMonth(-1)">‹</button>
                  <span>${formatMonthAr(monthKey)}</span>
                  <button onclick="changeMonth(1)">›</button>
                </div>
                <button class="ms-pill-btn" onclick="toggleCurrency()">${state.currencyMode === "dzd" ? "العملة: دينار (دج)" : "العملة: سنتيم"}</button>
                <button class="ms-pill-btn" onclick="toggleDarkMode()">${state.darkMode ? "☀️ نهاري" : "🌙 ليلي"}</button>
                <button class="ms-pill-btn" onclick="togglePrivacy()">${state.hideAmounts ? "👁️ إظهار" : "👁️ إخفاء"}</button>
                <button class="ms-pill-btn" onclick="speakSummary()">🔊 اقرأ لي</button>
              </div>
            </div>
            <div class="ms-balance-hero">
              <div>
                <div class="ms-balance-label">الرصيد الإجمالي في كل المحافظ</div>
                <div class="ms-balance-value">${fmt(totalBalance)}</div>
              </div>
              <div class="ms-quick-actions">
                <button class="ms-action-btn ms-action-expense" onclick="openTxModal('expense')">− مصروف</button>
                <button class="ms-action-btn ms-action-income" onclick="openTxModal('income')">+ مدخول</button>
                <button class="ms-action-btn ms-action-transfer" onclick="openTxModal('transfer')">⇄ تحويل</button>
                <button class="ms-action-btn ms-action-transfer" onclick="openCanIBuyModal()">🧮 هل أشتري؟</button>
                <button class="ms-action-btn ms-action-transfer" onclick="startVoiceEntry()">🎙️ صوتي</button>
              </div>
            </div>
          </div>
        </header>

        <div class="ms-container">
          <nav class="ms-desktop-tabs">
            <button class="ms-tab-btn ${activeTab === "dashboard" ? "active" : ""}" onclick="setTab('dashboard')">📊 الرئيسية</button>
            <button class="ms-tab-btn ${activeTab === "shopping" ? "active" : ""}" onclick="setTab('shopping')">📝 القضيان</button>
            <button class="ms-tab-btn ${activeTab === "debts" ? "active" : ""}" onclick="setTab('debts')">🤝 الديون</button>
            <button class="ms-tab-btn ${activeTab === "goals" ? "active" : ""}" onclick="setTab('goals')">🎯 الأهداف</button>
            <button class="ms-tab-btn ${activeTab === "wallets" ? "active" : ""}" onclick="setTab('wallets')">👛 المحافظ والميزانية</button>
          </nav>
          <main class="ms-main">${mainHtml}</main>
        </div>

        <nav class="ms-bottom-nav">
          <button class="${activeTab === "dashboard" ? "active" : ""}" onclick="setTab('dashboard')"><span>📊</span><span>الرئيسية</span></button>
          <button class="${activeTab === "shopping" ? "active" : ""}" onclick="setTab('shopping')"><span>📝</span><span>القضيان</span></button>
          <button class="${activeTab === "debts" ? "active" : ""}" onclick="setTab('debts')"><span>🤝</span><span>الديون</span></button>
          <button class="${activeTab === "goals" ? "active" : ""}" onclick="setTab('goals')"><span>🎯</span><span>الأهداف</span></button>
          <button class="${activeTab === "wallets" ? "active" : ""}" onclick="setTab('wallets')"><span>👛</span><span>المحافظ</span></button>
        </nav>
      `;
    }

    render();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/mizaniya-sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
